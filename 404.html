<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clear Path Texas</title>
  <meta name="robots" content="noindex" />
  <!-- The Statewide Expunction Clinic Day site has been retired. Every request to
       this domain (typed URL or QR code scan) forwards to the main Clear Path
       Texas site. 404.html carries the same redirect so deep links land too. -->
  <meta http-equiv="refresh" content="0; url=https://clearpathtexas.org/" />
  <link rel="canonical" href="https://clearpathtexas.org/" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <script>window.location.replace("https://clearpathtexas.org/");</script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #004E7B;
      background: #ffffff;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    p { font-size: 1.125rem; line-height: 1.5; }
    a { color: #004E7B; }
  </style>
</head>
<body>
  <p>
    Redirecting to <a href="https://clearpathtexas.org/">clearpathtexas.org</a>&hellip;
  </p>
</body>
</html>
